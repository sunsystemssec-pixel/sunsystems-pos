<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.3" stroke-dasharray="12 12" />
  
  <!-- Sun Rays / Tech Circuit lines -->
  <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="100" />
    <line x1="256" y1="412" x2="256" y2="452" />
    <line x1="60" y1="256" x2="100" y2="256" />
    <line x1="412" y1="256" x2="452" y2="256" />
    <line x1="118" y1="118" x2="148" y2="148" />
    <line x1="364" y1="364" x2="394" y2="394" />
    <line x1="364" y1="118" x2="394" y2="148" />
    <line x1="118" y1="364" x2="148" y2="394" />
  </g>

  <!-- Central Badge -->
  <circle cx="256" cy="256" r="140" fill="#020617" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Sun Core Symbol -->
  <circle cx="256" cy="256" r="60" fill="url(#goldGrad)" opacity="0.2" />
  
  <!-- "SUN" Text or Emblem -->
  <text x="256" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#fbbf24" letter-spacing="4">SUN</text>
  <text x="256" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#e2e8f0" letter-spacing="6">SYSTEMS</text>
  <text x="256" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#10b981" letter-spacing="3">INTERNAL AUDIT</text>
</svg>
