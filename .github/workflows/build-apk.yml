name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sun Systems APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1 || touch ../failed.flag

      - name: Save Log to Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          cp ../gradle_build.log ./gradle_build.log
          git add gradle_build.log
          git commit -m "Auto save gradle build log" || true
          git push -f origin build-logs || true
          if [ -f ../failed.flag ]; then
            echo "Build failed! Log saved to build-logs branch."
            exit 1
          fi

      - name: Upload Sun Systems APK
        uses: actions/upload-artifact@v4
        with:
          name: SunSystems-POS-APK
          path: android/**/*.apk
