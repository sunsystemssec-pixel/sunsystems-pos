name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sun Systems APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses and Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Direct APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SunSystems-POS-latest.apk

      - name: Upload Sun Systems APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunSystems-POS-APK
          path: SunSystems-POS-latest.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "Sun Systems POS - Latest Release"
          body: |
            ### Sun Systems POS - Latest Direct APK Download
            Direct, uncompressed APK download with fingerprint biometric scanner and WhatsApp PDF direct sharing.
            
            **Installation instructions**:
            - Tap `SunSystems-POS-latest.apk` below to download directly (no unzipping required!).
            - If you had a previous version installed, uninstall it first once, then tap to install.
          files: SunSystems-POS-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
